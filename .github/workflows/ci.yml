name: Validacion Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Comprobar compilacion con Docker Build
        run: docker buildx build --check .

      - name: Comprobar compilacion con Docker Bake
        run: docker buildx bake --check

      - name: Construir imagen Docker
        run: docker build -t proyecto-docker .

      - name: Ejecutar codigo desde el repositorio
        run: docker run --rm proyecto-docker
